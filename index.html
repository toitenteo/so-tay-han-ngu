<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#121110" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Sổ Tay Hán Ngữ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.19.6/dist/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #121110;
      color: #f3efe9;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    .hanzi-font {
      font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #332f2c; border-radius: 99px; }
    .blur-mask {
      filter: blur(6px);
      user-select: none;
      transition: filter 0.2s ease;
    }
    .blur-mask.revealed {
      filter: blur(0);
    }
    @keyframes pulse-soft {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .animate-pulse-soft {
      animation: pulse-soft 1.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col max-w-md mx-auto bg-[#121110] relative pb-24">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-[#121110]/95 backdrop-blur border-b border-[#262320] px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-[#9a342a] flex items-center justify-center text-[#f7e7d4] font-bold text-lg hanzi-font shadow-inner">
        汉
      </div>
      <div>
        <h1 class="text-[15px] font-bold text-[#f3efe9] leading-tight">Sổ Tay Hán Ngữ</h1>
        <p class="text-[11px] text-[#9b938a]">Nhớ mặt chữ &amp; Phản xạ nói</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="cycleSpeechRate()" id="rateBtn" class="px-2.5 py-1.5 rounded-lg bg-[#221f1d] border border-[#322e2a] text-[12px] font-semibold text-[#d6cec3] flex items-center gap-1 active:scale-95 transition">
        <span>🔊</span> <span id="rateLabel">1x</span>
      </button>
      <div class="px-2.5 py-1.5 rounded-lg bg-[#2a1f16] border border-[#453120] text-[12px] font-bold text-[#f59e0b] flex items-center gap-1">
        <span>🔥</span> <span id="streakCount">1</span>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main id="appMain" class="flex-1 px-4 pt-3 space-y-4">
    <!-- Tab content rendered dynamically -->
  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#171513]/95 backdrop-blur border-t border-[#262320] px-2 py-2 flex justify-around items-center z-40">
    <button onclick="switchTab('vocab')" data-tab="vocab" class="nav-btn flex flex-col items-center gap-1 px-3 py-1 rounded-xl text-[#e07a5f]">
      <span class="text-lg">📖</span>
      <span class="text-[11px] font-medium">Sổ học</span>
    </button>
    <button onclick="switchTab('database')" data-tab="database" class="nav-btn flex flex-col items-center gap-1 px-3 py-1 rounded-xl text-[#8b837a]">
      <span class="text-lg">🗂️</span>
      <span class="text-[11px] font-medium">Kho từ</span>
    </button>
    <button onclick="switchTab('speak')" data-tab="speak" class="nav-btn flex flex-col items-center gap-1 px-3 py-1 rounded-xl text-[#8b837a]">
      <span class="text-lg">🗣️</span>
      <span class="text-[11px] font-medium">Giao tiếp</span>
    </button>
    <button onclick="switchTab('stats')" data-tab="stats" class="nav-btn flex flex-col items-center gap-1 px-3 py-1 rounded-xl text-[#8b837a]">
      <span class="text-lg">⚙️</span>
      <span class="text-[11px] font-medium">Tiến độ &amp; AI</span>
    </button>
  </nav>

  <!-- Modal: Thêm từ vựng mới -->
  <div id="addModal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-xs hidden flex-col justify-end">
    <div class="bg-[#1b1917] border-t border-[#302c28] rounded-t-3xl p-5 max-w-md w-full mx-auto space-y-3.5 max-h-[92vh] overflow-y-auto shadow-2xl">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-bold text-[#f3efe9]">Thêm từ vựng mới</h2>
        <button onclick="closeAddModal()" class="w-8 h-8 rounded-full bg-[#2a2623] text-[#a8a096] flex items-center justify-center text-sm">✕</button>
      </div>

      <!-- Chữ Hán -->
      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="text-xs font-medium text-[#b5ada3]">Chữ Hán (Hanzi) *</label>
          <span id="autoFillStatus" class="text-[11px] text-[#e07a5f] hidden"></span>
        </div>
        <div class="flex gap-2">
          <input type="text" id="inputHanzi" oninput="handleHanziInput(this.value)" placeholder="Ví dụ: 休息"
            class="flex-1 bg-[#25221f] border border-[#38332e] focus:border-[#c85a48] rounded-xl px-3.5 py-2.5 text-base hanzi-font text-[#f3efe9] outline-none" />
          <button type="button" onclick="triggerDeepAI()" id="aiFillBtn"
            class="px-3 py-2 rounded-xl bg-[#2f231e] border border-[#5e392e] text-[#f29b7e] text-xs font-semibold flex items-center gap-1 active:scale-95 transition whitespace-nowrap">
            <span>✨</span> <span>AI Chiết tự</span>
          </button>
        </div>
      </div>

      <!-- Pinyin -->
      <div>
        <label class="block text-xs font-medium text-[#b5ada3] mb-1">Pinyin (Tự động điền)</label>
        <input type="text" id="inputPinyin" placeholder="xiū xi"
          class="w-full bg-[#25221f] border border-[#38332e] rounded-xl px-3.5 py-2 text-sm text-[#e5ded5] outline-none" />
      </div>

      <!-- Nghĩa tiếng Việt -->
      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="text-xs font-medium text-[#b5ada3]">Nghĩa tiếng Việt *</label>
          <span id="meaningTag" class="text-[10px] text-[#8b837a]">Tự động gợi ý</span>
        </div>
        <input type="text" id="inputMeaning" placeholder="Ví dụ: Nghỉ ngơi"
          class="w-full bg-[#25221f] border border-[#38332e] focus:border-[#c85a48] rounded-xl px-3.5 py-2 text-sm text-[#f3efe9] outline-none" />
      </div>

      <!-- Chiết tự / Mẹo nhớ mặt chữ -->
      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="text-xs font-medium text-[#d4b475] flex items-center gap-1">
            <span>💡</span> Chiết tự / Mẹo nhớ mặt chữ
          </label>
          <span id="mnemonicTag" class="text-[10px] text-[#8b837a]">Tự tách bộ thủ</span>
        </div>
        <textarea id="inputMnemonic" rows="2" placeholder="Ví dụ: Người (人) tựa vào gốc cây (木) để nghỉ ngơi (休)"
          class="w-full bg-[#25221f] border border-[#38332e] focus:border-[#d4b475] rounded-xl px-3.5 py-2 text-xs leading-relaxed text-[#f3efe9] outline-none resize-none"></textarea>
      </div>

      <!-- Mức độ nhớ mặt chữ -->
      <div>
        <label class="block text-xs font-medium text-[#b5ada3] mb-1">Mức độ nhớ mặt chữ</label>
        <select id="inputLevel" class="w-full bg-[#25221f] border border-[#38332e] rounded-xl px-3.5 py-2.5 text-sm text-[#f3efe9] outline-none">
          <option value="new">🔴 Mới học (Cần ôn nhiều)</option>
          <option value="learning">🟡 Đang nhớ (Ôn định kỳ)</option>
          <option value="mastered">🟢 Đã thuộc mặt chữ</option>
        </select>
      </div>

      <!-- Actions -->
      <div class="grid grid-cols-2 gap-3 pt-1">
        <button type="button" onclick="closeAddModal()" class="py-3 rounded-xl bg-[#2a2623] text-[#d6cec3] font-semibold text-sm active:scale-95 transition">
          Hủy
        </button>
        <button type="button" onclick="saveNewWord()" class="py-3 rounded-xl bg-[#b9382c] text-white font-semibold text-sm active:scale-95 transition shadow-lg">
          Lưu từ vựng
        </button>
      </div>
    </div>
  </div>

  <!-- Modal: Tập viết nét chữ Hán -->
  <div id="writerModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-xs hidden items-center justify-center p-4">
    <div class="bg-[#1b1917] border border-[#302c28] rounded-3xl p-5 max-w-sm w-full space-y-4">
      <div class="flex items-center justify-between">
        <div>
          <h3 class="text-base font-bold text-[#f3efe9]">Tập viết nét chữ Hán</h3>
          <p id="writerWordInfo" class="text-xs text-[#9b938a]"></p>
        </div>
        <button onclick="closeWriterModal()" class="w-8 h-8 rounded-full bg-[#2a2623] text-[#a8a096] flex items-center justify-center text-sm">✕</button>
      </div>
      <div id="charSelector" class="flex justify-center gap-2"></div>
      <div class="flex justify-center">
        <div id="characterTarget" class="bg-[#24211e] rounded-2xl border border-[#38332e] overflow-hidden"></div>
      </div>
      <div class="grid grid-cols-2 gap-2.5">
        <button onclick="animateWriter()" class="py-2.5 rounded-xl bg-[#2a2623] text-[#f3efe9] text-xs font-semibold">▶️ Xem mẫu viết</button>
        <button onclick="quizWriter()" class="py-2.5 rounded-xl bg-[#b9382c] text-white text-xs font-semibold">✍️ Tự tô nét</button>
      </div>
    </div>
  </div>

  <!-- Modal: Flashcard Ôn tập Ghi nhớ Nhắc lại -->
  <div id="reviewModal" class="fixed inset-0 z-50 bg-[#121110] hidden flex-col p-4 max-w-md mx-auto">
    <div class="flex items-center justify-between py-2">
      <button onclick="closeReviewModal()" class="px-3 py-1.5 rounded-xl bg-[#221f1d] text-xs text-[#b5ada3]">✕ Thoát</button>
      <span id="reviewProgress" class="text-xs font-semibold text-[#e07a5f]">1 / 5</span>
      <button onclick="speakCurrentReview()" class="px-3 py-1.5 rounded-xl bg-[#221f1d] text-xs text-[#f3efe9]">🔊 Nghe</button>
    </div>

    <div class="flex-1 flex flex-col justify-center my-4">
      <div onclick="flipReviewCard()" id="reviewCard" class="bg-[#1c1917] border border-[#2e2a26] rounded-3xl p-6 min-h-[300px] flex flex-col items-center justify-center text-center cursor-pointer shadow-xl relative">
        <span class="text-[11px] text-[#7a7269] absolute top-4">Chạm vào thẻ để lật đáp án</span>
        <div id="reviewHanzi" class="text-6xl font-bold hanzi-font text-[#f3efe9] mb-4"></div>
        <div id="reviewBack" class="hidden space-y-3 w-full pt-3 border-t border-[#2c2824]">
          <div id="reviewPinyin" class="text-lg font-semibold text-[#e07a5f]"></div>
          <div id="reviewMeaning" class="text-base font-bold text-[#f3efe9]"></div>
          <div id="reviewMnemonic" class="text-xs text-[#d4b475] bg-[#262118] p-3 rounded-xl leading-relaxed"></div>
        </div>
      </div>
    </div>

    <div id="reviewActions" class="grid grid-cols-3 gap-2.5 pb-4">
      <button onclick="answerReview('again')" class="py-3.5 rounded-2xl bg-[#381d1b] border border-[#612c28] text-[#f87171] font-bold text-xs active:scale-95">
        🔴 Quên rồi<br><span class="text-[10px] font-normal opacity-80">Nhắc lại ngay</span>
      </button>
      <button onclick="answerReview('good')" class="py-3.5 rounded-2xl bg-[#362c18] border border-[#5e4b24] text-[#fbbf24] font-bold text-xs active:scale-95">
        🟡 Hơi nhớ<br><span class="text-[10px] font-normal opacity-80">Ôn định kỳ</span>
      </button>
      <button onclick="answerReview('easy')" class="py-3.5 rounded-2xl bg-[#193324] border border-[#27543a] text-[#4ade80] font-bold text-xs active:scale-95">
        🟢 Đã thuộc<br><span class="text-[10px] font-normal opacity-80">Nhớ mặt chữ</span>
      </button>
    </div>
  </div>

    // ==========================================
    function speakChinese(text) {
      if (!text) return;
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = 'zh-CN';
          utter.rate = state.speechRate;
          const voices = window.speechSynthesis.getVoices();
          const zhVoice = voices.find(v => v.lang.includes('zh') || v.lang.includes('cmn'));
          if (zhVoice) {
            utter.voice = zhVoice;
            window.speechSynthesis.speak(utter);
            return;
          }
        }
      } catch (e) {}

      // Fallback Audio TTS cho điện thoại thiếu gói giọng đọc zh-CN
      const url = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-CN&q=${encodeURIComponent(text)}`;
      const audio = new Audio(url);
      audio.playbackRate = state.speechRate;
      audio.play().catch(() => {});
    }

    function cycleSpeechRate() {
      const rates = [1.0, 0.8, 1.2];
      const nextIdx = (rates.indexOf(state.speechRate) + 1) % rates.length;
      state.speechRate = rates[nextIdx];
      saveState();
    }

    function buildLocalMnemonic(hanzi) {
      const clean = hanzi.replace(/[^\u4e00-\u9fa5]/g, '');
      if (!clean) return '';

      // 1. Kiểm tra cụm từ có sẵn trong kho
      const exactCore = CORE_DATABASE.find(item => item.hanzi === clean);
      if (exactCore && exactCore.mnemonic) return exactCore.mnemonic;

      // 2. Phân tách từng chữ Hán
      const parts = [];
      for (const ch of clean) {
        if (CHAR_DECOMP[ch]) {
          const radList = CHAR_DECOMP[ch].map(r => `${r} (${RADICAL_DB[r] || 'bộ thủ'})`).join(' + ');
          const wholeNote = RADICAL_DB[ch] ? ` → ${RADICAL_DB[ch]}` : '';
          parts.push(`• ${ch} = ${radList}${wholeNote}`);
        } else if (RADICAL_DB[ch]) {
          parts.push(`• ${ch}: ${RADICAL_DB[ch]}`);
        }
      }
      return parts.join('\n');
    }

    async function fetchFreeMeaning(hanzi) {
      // 1. Tra trong kho từ nội bộ trước cho siêu nhanh
      const found = CORE_DATABASE.find(w => w.hanzi === hanzi.trim());
      if (found) return { meaning: found.meaning, source: 'Kho từ điển' };

      // 2. Gọi API dịch miễn phí (MyMemory / Google Translate endpoint công cộng)
      try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=vi&dt=t&q=${encodeURIComponent(hanzi)}`);
        if (res.ok) {
          const data = await res.json();
          const translated = data?.[0]?.map(item => item[0]).join('').trim();
          if (translated && translated !== hanzi) {
            return { meaning: translated.charAt(0).toUpperCase() + translated.slice(1), source: 'Tự động dịch' };
          }
        }
      } catch (e) {}
      return null;
    }

    function handleHanziInput(val) {

      const meaningEl = document.getElementById('inputMeaning');
      const mnemonicEl = document.getElementById('inputMnemonic');
      const statusEl = document.getElementById('autoFillStatus');

      if (!trimmed) {
        pinyinEl.value = '';
        statusEl.classList.add('hidden');
        return;
      }

      // 1. Tự động điền Pinyin ngay lập tức
      if (window.pinyinPro) {
        pinyinEl.value = window.pinyinPro.pinyin(trimmed, { toneType: 'symbol' });
      }

      // 2. Tự động tách bộ thủ chiết tự ngay lập tức
      const autoMnemonic = buildLocalMnemonic(trimmed);
      if (autoMnemonic) {
        mnemonicEl.value = autoMnemonic;
        document.getElementById('mnemonicTag').textContent = 'Đã tách bộ thủ';
      }

      // 3. Debounce tự động điền Nghĩa tiếng Việt sau 450ms ngừng gõ
      clearTimeout(autoFillTimer);
      statusEl.textContent = 'Đang tra nghĩa...';
      statusEl.classList.remove('hidden');

      autoFillTimer = setTimeout(async () => {
        const result = await fetchFreeMeaning(trimmed);
        if (result && document.getElementById('inputHanzi').value.trim() === trimmed) {
          meaningEl.value = result.meaning;
          document.getElementById('meaningTag').textContent = result.source;
        }
        statusEl.classList.add('hidden');
      }, 450);
    }

          rawText = data.choices?.[0]?.message?.content || '';
        } else {
          // Mặc định Gemini Flash Free Tier
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${state.aiConfig.apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { temperature: 0.4 }
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error?.message || 'Lỗi Gemini API');
          rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
        }

        const jsonMatch = rawText.match(/\{[\s\S]*\}/);
        if (!jsonMatch) throw new Error('AI trả về sai định dạng');
        const parsed = JSON.parse(jsonMatch[0]);

        if (parsed.meaning) {
          document.getElementById('inputMeaning').value = parsed.meaning;
          document.getElementById('meaningTag').textContent = '✨ AI điền';
        }
        if (parsed.mnemonic) {
          document.getElementById('inputMnemonic').value = parsed.mnemonic;
          document.getElementById('mnemonicTag').textContent = '✨ AI chiết tự';
        }
      } catch (err) {
        alert('Không gọi được AI: ' + err.message + '\n(Hệ thống vẫn giữ nguyên nghĩa và bộ thủ tự động bên dưới cho bạn!)');
      } finally {
        btn.disabled = false;
        btn.innerHTML = origHtml;
      }
    }

    // ==========================================

    // ==========================================
    function openAddModal() {
      document.getElementById('inputHanzi').value = '';
      document.getElementById('inputPinyin').value = '';
      document.getElementById('inputMeaning').value = '';
      document.getElementById('inputMnemonic').value = '';
      document.getElementById('inputLevel').value = 'new';
      document.getElementById('meaningTag').textContent = 'Tự động gợi ý';
      document.getElementById('mnemonicTag').textContent = 'Tự tách bộ thủ';
      document.getElementById('autoFillStatus').classList.add('hidden');
      const modal = document.getElementById('addModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      setTimeout(() => document.getElementById('inputHanzi').focus(), 100);
    }

    function closeAddModal() {
      const modal = document.getElementById('addModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function saveNewWord() {
      const hanzi = document.getElementById('inputHanzi').value.trim();
      const pinyin = document.getElementById('inputPinyin').value.trim();
      const meaning = document.getElementById('inputMeaning').value.trim();
      const mnemonic = document.getElementById('inputMnemonic').value.trim();
      const level = document.getElementById('inputLevel').value;

      if (!hanzi || !meaning) {
        alert('Bạn cần nhập đầy đủ Chữ Hán và Nghĩa tiếng Việt nhé!');
        return;
      }

      state.vocab.unshift({
        id: Date.now(),
        hanzi,
        pinyin,
        meaning,
        mnemonic,
        level
      });
      saveState();
      closeAddModal();
      renderApp();
    }

    function deleteWord(id) {
      if (!confirm('Xóa từ vựng này khỏi sổ của bạn?')) return;
      state.vocab = state.vocab.filter(w => w.id !== id);
      selectedReviewIds.delete(id);
      saveState();
      renderApp();
    }

    function cycleWordLevel(id) {
      const order = ['new', 'learning', 'mastered'];
      const w = state.vocab.find(item => item.id === id);
      if (w) {
        w.level = order[(order.indexOf(w.level) + 1) % order.length];
        saveState();
        renderApp();
      }
    }

    function toggleSelectMode() {
      selectMode = !selectMode;
      selectedReviewIds.clear();
      renderApp();
    }

    function toggleSelectWord(id) {
      if (selectedReviewIds.has(id)) selectedReviewIds.delete(id);
      else selectedReviewIds.add(id);
      renderApp();
    }

    function toggleDbSelect(hanzi) {
      if (selectedDbWords.has(hanzi)) selectedDbWords.delete(hanzi);
      else selectedDbWords.add(hanzi);
      renderApp();
    }

    function importSelectedDbWords() {
      const toAdd = CORE_DATABASE.filter(item => selectedDbWords.has(item.hanzi));
      toAdd.forEach((item, idx) => {
        state.vocab.unshift({
          id: Date.now() + idx,
          hanzi: item.hanzi,
          pinyin: item.pinyin,
          meaning: item.meaning,
          mnemonic: item.mnemonic,
          level: 'new'
        });
      });
      selectedDbWords.clear();
      saveState();
      switchTab('vocab');
    }

      let pool = [];
      if (selectMode && selectedReviewIds.size > 0) {
        pool = state.vocab.filter(w => selectedReviewIds.has(w.id));
      } else {
        pool = state.vocab.filter(w => w.level !== 'mastered');
      }
      if (pool.length === 0) pool = [...state.vocab];
      if (pool.length === 0) {
        alert('Sổ của bạn chưa có từ nào để ôn!');
        return;
      }

      reviewQueue = [...pool];
      reviewIndex = 0;
      const modal = document.getElementById('reviewModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      showCurrentReviewCard();
    }

    function closeReviewModal() {
      const modal = document.getElementById('reviewModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      renderApp();
    }

    function showCurrentReviewCard() {
      if (reviewIndex >= reviewQueue.length) {
        alert('🎉 Tuyệt vời! Bạn đã hoàn thành phiên ôn tập ghi nhớ nhắc lại!');
        closeReviewModal();
        return;
      }
      const w = reviewQueue[reviewIndex];
      reviewFlipped = false;
      document.getElementById('reviewProgress').textContent = `${reviewIndex + 1} / ${reviewQueue.length}`;
      document.getElementById('reviewHanzi').textContent = w.hanzi;
      document.getElementById('reviewPinyin').textContent = w.pinyin;
      document.getElementById('reviewMeaning').textContent = w.meaning;
      document.getElementById('reviewMnemonic').textContent = w.mnemonic ? `💡 ${w.mnemonic}` : 'Chưa có ghi chú chiết tự';
      document.getElementById('reviewBack').classList.add('hidden');
      speakChinese(w.hanzi);
    }

    function flipReviewCard() {
      reviewFlipped = !reviewFlipped;
      document.getElementById('reviewBack').classList.toggle('hidden', !reviewFlipped);
    }

    function speakCurrentReview() {
      const w = reviewQueue[reviewIndex];
      if (w) speakChinese(w.hanzi);
    }

    function answerReview(rating) {
      const w = reviewQueue[reviewIndex];
      const orig = state.vocab.find(item => item.id === w.id);
      if (rating === 'again') {
        if (orig) orig.level = 'new';
        // Đẩy thẻ quay lại hàng đợi sau 2 thẻ nữa để nhắc lại
        const insertPos = Math.min(reviewQueue.length, reviewIndex + 3);
        reviewQueue.splice(insertPos, 0, w);
      } else if (rating === 'good') {
        if (orig) orig.level = 'learning';
      } else if (rating === 'easy') {
        if (orig) orig.level = 'mastered';
      }
      saveState();
      reviewIndex++;
      showCurrentReviewCard();
    }

    // Hanzi Writer (Tập viết nét)
    function openWriterModal(hanzi, info) {
      writerChars = hanzi.replace(/[^\u4e00-\u9fa5]/g, '').split('');
      if (writerChars.length === 0) return;
      document.getElementById('writerWordInfo').textContent = info;
      const selector = document.getElementById('charSelector');
      selector.innerHTML = writerChars.map((ch, idx) => `
        <button onclick="loadWriterChar('${ch}')" class="w-10 h-10 rounded-xl bg-[#26221f] text-lg hanzi-font font-bold text-[#f3efe9] border border-[#38332e]">${ch}</button>
      `).join('');
      const modal = document.getElementById('writerModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      loadWriterChar(writerChars[0]);
    }

    function loadWriterChar(ch) {
      const target = document.getElementById('characterTarget');
      target.innerHTML = '';
      currentWriter = HanziWriter.create('characterTarget', ch, {
        width: 220,
        height: 220,
        padding: 15,
        strokeColor: '#f3efe9',
        radicalColor: '#e07a5f',
        outlineColor: '#38332e',
        showOutline: true
      });
      currentWriter.animateCharacter();
    }

    function animateWriter() { if (currentWriter) currentWriter.animateCharacter(); }
    function quizWriter() { if (currentWriter) currentWriter.quiz(); }
    function closeWriterModal() {
      const modal = document.getElementById('writerModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // Backup & Restore
    function exportBackup() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `sotay-hanngu-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
    }

    function importBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (Array.isArray(parsed.vocab)) {
            state = { ...state, ...parsed };
            saveState();
            renderApp();
            alert('✅ Khôi phục dữ liệu thành công!');
          }
        } catch (err) {
          alert('File sao lưu không hợp lệ!');
        }
      };
      reader.readAsText(file);
    }

    // Khởi chạy ứng dụng
    loadState();
    renderApp();
  </script>
</body>
</html>
