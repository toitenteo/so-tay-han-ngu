<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#141210" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Sổ Tay Hán Ngữ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.19.6/dist/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #141210;
      color: #f2ede6;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    .hanzi-font {
      font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #36302b; border-radius: 99px; }
    .blur-item {
      filter: blur(6px);
      user-select: none;
      transition: filter 0.2s ease;
    }
    .blur-item.revealed {
      filter: blur(0);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col max-w-md mx-auto bg-[#141210] relative pb-24">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-[#141210]/95 backdrop-blur border-b border-[#26221e] px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-[#a8382b] flex items-center justify-center text-[#f7e7d4] font-bold text-lg hanzi-font shadow">
        汉
      </div>
      <div>
        <h1 class="text-[15px] font-bold text-[#f2ede6] leading-tight">Sổ Tay Hán Ngữ</h1>
        <p class="text-[11px] text-[#9c9288]">Nhớ mặt chữ &amp; Phản xạ nói</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="cycleSpeechRate()" class="px-2.5 py-1.5 rounded-xl bg-[#24201d] border border-[#332d28] text-[12px] font-semibold text-[#dfd7cd] flex items-center gap-1 active:scale-95 transition">
        <span>🗣️</span> <span id="rateLabel">1x</span>
      </button>
      <div class="px-2.5 py-1.5 rounded-xl bg-[#2b2116] border border-[#47341f] text-[12px] font-bold text-[#f59e0b] flex items-center gap-1">
        <span>🔥</span> <span id="streakCount">1</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main id="appMain" class="flex-1 px-4 pt-3 space-y-4"></main>

  <!-- Bottom Navigation (5 Tabs gốc) -->
  <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#181512]/95 backdrop-blur border-t border-[#26221e] px-1 py-2 flex justify-around items-center z-40">
    <button onclick="switchTab('dashboard')" data-tab="dashboard" class="nav-btn flex flex-col items-center gap-0.5 px-2.5 py-1 rounded-xl text-[#8f857b]">
      <span class="text-base">📊</span>
      <span class="text-[10px] font-medium">Tổng quan</span>
    </button>
    <button onclick="switchTab('vocab')" data-tab="vocab" class="nav-btn flex flex-col items-center gap-0.5 px-2.5 py-1 rounded-xl text-[#e07a5f] bg-[#241e1a]">
      <span class="text-base">📖</span>
      <span class="text-[10px] font-medium">Sổ học</span>
    </button>
    <button onclick="switchTab('database')" data-tab="database" class="nav-btn flex flex-col items-center gap-0.5 px-2.5 py-1 rounded-xl text-[#8f857b]">
      <span class="text-base">🗂️</span>
      <span class="text-[10px] font-medium">Kho từ</span>
    </button>
    <button onclick="switchTab('speak')" data-tab="speak" class="nav-btn flex flex-col items-center gap-0.5 px-2.5 py-1 rounded-xl text-[#8f857b]">
      <span class="text-base">💬</span>
      <span class="text-[10px] font-medium">Giao tiếp</span>
    </button>
    <button onclick="switchTab('journal')" data-tab="journal" class="nav-btn flex flex-col items-center gap-0.5 px-2.5 py-1 rounded-xl text-[#8f857b]">
      <span class="text-base">📝</span>
      <span class="text-[10px] font-medium">Nhật ký</span>
    </button>
  </nav>

  <!-- Modal: Thêm từ vựng mới (Giữ nguyên giao diện cũ + Tự động điền Nghĩa & Chiết tự) -->
  <div id="addModal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-xs hidden flex-col justify-end">
    <div class="bg-[#1e1b18] border-t border-[#332d28] rounded-t-3xl p-5 max-w-md w-full mx-auto space-y-3.5 max-h-[92vh] overflow-y-auto shadow-2xl">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-bold text-[#f2ede6]">Thêm từ vựng mới</h2>
        <button onclick="closeAddModal()" class="w-8 h-8 rounded-full bg-[#2c2723] text-[#a89e94] flex items-center justify-center text-sm">✕</button>
      </div>

      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="text-xs font-medium text-[#b8afa6]">Chữ Hán (Hanzi) *</label>
          <span id="autoStatus" class="text-[11px] text-[#e07a5f] hidden">Đang tra nghĩa...</span>
        </div>
        <div class="flex gap-2">
          <input type="text" id="inputHanzi" oninput="onHanziChanged(this.value)" placeholder="Ví dụ: 休息"
            class="flex-1 bg-[#2c2621] border border-[#3d352e] focus:border-[#b83d2e] rounded-xl px-3.5 py-2.5 text-lg hanzi-font text-[#f2ede6] placeholder-[#8c8278] outline-none" />
          <button type="button" id="aiBtn" onclick="runAiAutoFill()"
            class="px-3 rounded-xl bg-[#2e241c] border border-[#543d2a] text-[#e8b878] text-xs font-semibold flex items-center gap-1 active:scale-95 transition whitespace-nowrap">
            <span>✨</span> <span>AI</span>
          </button>
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-[#b8afa6] mb-1">Pinyin (Tự động điền)</label>
        <input type="text" id="inputPinyin" placeholder="xiū xi"
          class="w-full bg-[#2c2621] border border-[#3d352e] rounded-xl px-3.5 py-2.5 text-sm text-[#e6dfd5] placeholder-[#8c8278] outline-none" />
      </div>

      <div>
        <label class="block text-xs font-medium text-[#b8afa6] mb-1">Nghĩa tiếng Việt *</label>
        <input type="text" id="inputMeaning" placeholder="Ví dụ: Nghỉ ngơi"
          class="w-full bg-[#2c2621] border border-[#3d352e] focus:border-[#b83d2e] rounded-xl px-3.5 py-2.5 text-sm text-[#f2ede6] placeholder-[#8c8278] outline-none" />
      </div>

      <div>
        <label class="block text-xs font-medium text-[#d9b86c] mb-1">💡 Chiết tự / Mẹo nhớ mặt chữ (Rất hiệu quả)</label>
        <textarea id="inputMnemonic" rows="2" placeholder="Ví dụ: Người (人) tựa vào gốc cây (木) để nghỉ ngơi (休)"
          class="w-full bg-[#292418] border border-[#524626] focus:border-[#d9b86c] rounded-xl px-3.5 py-2.5 text-xs leading-relaxed text-[#f2ede6] placeholder-[#998c6c] outline-none resize-none"></textarea>
      </div>

      <div>
        <label class="block text-xs font-medium text-[#b8afa6] mb-1">Mức độ nhớ mặt chữ</label>
        <select id="inputLevel" class="w-full bg-[#2c2621] border border-[#3d352e] rounded-xl px-3.5 py-2.5 text-sm text-[#f2ede6] outline-none">
          <option value="new">🔴 Mới học (Cần ôn nhiều)</option>
          <option value="learning">🟡 Đang nhớ (Ôn định kỳ)</option>
          <option value="mastered">🟢 Đã thuộc mặt chữ</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-3 pt-1">
        <button type="button" onclick="closeAddModal()" class="py-3 rounded-xl bg-[#2c2723] text-[#dfd7cd] font-semibold text-sm active:scale-95 transition">
          Hủy
        </button>
        <button type="button" onclick="saveNewWord()" class="py-3 rounded-xl bg-[#b83d2e] text-white font-semibold text-sm active:scale-95 transition">
          Lưu từ vựng
        </button>
      </div>
    </div>
  </div>

  <!-- Modal: Tập viết nét chữ Hán -->
  <div id="writerModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-xs hidden items-center justify-center p-4">
    <div class="bg-[#1e1b18] border border-[#332d28] rounded-3xl p-5 max-w-sm w-full space-y-4">
      <div class="flex items-center justify-between">
        <div>
          <h3 class="text-base font-bold text-[#f2ede6]">Tập viết nét chữ Hán</h3>
          <p id="writerInfo" class="text-xs text-[#9c9288]"></p>
        </div>
        <button onclick="closeWriterModal()" class="w-8 h-8 rounded-full bg-[#2c2723] text-[#a89e94] flex items-center justify-center text-sm">✕</button>
      </div>
      <div id="writerChars" class="flex justify-center gap-2"></div>
      <div class="flex justify-center">
        <div id="writerCanvas" class="bg-[#26221e] rounded-2xl border border-[#3d352e] overflow-hidden"></div>
      </div>
      <div class="grid grid-cols-2 gap-2.5">
        <button onclick="animateWriter()" class="py-2.5 rounded-xl bg-[#2c2723] text-[#f2ede6] text-xs font-semibold">▶️ Xem mẫu viết</button>
        <button onclick="quizWriter()" class="py-2.5 rounded-xl bg-[#b83d2e] text-white text-xs font-semibold">✍️ Tự tô nét</button>
      </div>
    </div>
  </div>

  <!-- Modal: Flashcard Ôn tập Ghi nhớ Nhắc lại -->
  <div id="reviewModal" class="fixed inset-0 z-50 bg-[#141210] hidden flex-col p-4 max-w-md mx-auto">
    <div class="flex items-center justify-between py-2">
      <button onclick="closeReviewModal()" class="px-3 py-1.5 rounded-xl bg-[#24201d] text-xs text-[#b8afa6]">✕ Thoát</button>
      <span id="reviewCounter" class="text-xs font-semibold text-[#e07a5f]">1 / 5</span>
      <button onclick="speakCurrentReview()" class="px-3 py-1.5 rounded-xl bg-[#24201d] text-xs text-[#f2ede6]">🔊 Nghe</button>
    </div>

    <div class="flex-1 flex flex-col justify-center my-4">
      <div onclick="flipReviewCard()" class="bg-[#1e1b18] border border-[#332d28] rounded-3xl p-6 min-h-[300px] flex flex-col items-center justify-center text-center cursor-pointer shadow-xl relative">
        <span class="text-[11px] text-[#8c8278] absolute top-4">Chạm vào thẻ để xem đáp án</span>
        <div id="reviewHanzi" class="text-6xl font-bold hanzi-font text-[#f2ede6] mb-4"></div>
        <div id="reviewAnswer" class="hidden space-y-3 w-full pt-3 border-t border-[#2e2924]">
          <div id="reviewPinyin" class="text-lg font-semibold text-[#e07a5f]"></div>
          <div id="reviewMeaning" class="text-base font-bold text-[#f2ede6]"></div>
          <div id="reviewMnemonic" class="text-xs text-[#d9b86c] bg-[#292418] p-3 rounded-xl leading-relaxed whitespace-pre-line"></div>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-3 gap-2.5 pb-4">
      <button onclick="gradeReview('again')" class="py-3.5 rounded-2xl bg-[#381d1b] border border-[#612c28] text-[#f87171] font-bold text-xs active:scale-95">
        🔴 Quên rồi<br><span class="text-[10px] font-normal opacity-80">Nhắc lại ngay</span>
      </button>
      <button onclick="gradeReview('good')" class="py-3.5 rounded-2xl bg-[#362c18] border border-[#5e4b24] text-[#fbbf24] font-bold text-xs active:scale-95">
        🟡 Hơi nhớ<br><span class="text-[10px] font-normal opacity-80">Ôn định kỳ</span>
      </button>
      <button onclick="gradeReview('easy')" class="py-3.5 rounded-2xl bg-[#193324] border border-[#27543a] text-[#4ade80] font-bold text-xs active:scale-95">
        🟢 Đã thuộc<br><span class="text-[10px] font-normal opacity-80">Nhớ mặt chữ</span>
      </button>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. BỘ THỦ & KHO TỪ ĐIỂN CỐT LÕI
    // ==========================================
    const RADICALS = {
      '人': 'Người', '亻': 'Người đứng', '木': 'Cây', '口': 'Miệng', '日': 'Mặt trời/Ngày',
      '月': 'Mặt trăng/Tháng/Thịt', '水': 'Nước', '氵': 'Ba chấm nước', '火': 'Lửa', '灬': 'Bốn chấm lửa',
      '土': 'Đất', '金': 'Kim loại', '钅': 'Kim loại', '心': 'Tim', '忄': 'Tâm đứng (cảm xúc)',
      '手': 'Tay', '扌': 'Tay gảy', '女': 'Phụ nữ', '子': 'Con trẻ', '宀': 'Mái nhà',
      '广': 'Mái hiên', '门': 'Cánh cửa', '山': 'Núi', '石': 'Đá', '田': 'Ruộng',
      '目': 'Mắt', '耳': 'Tai', '足': 'Chân', '走': 'Đi chạy', '辶': 'Bước đi',
      '言': 'Lời nói', '讠': 'Lời nói', '食': 'Thức ăn', '饣': 'Ăn uống', '衣': 'Áo',
      '衤': 'Y phục', '马': 'Ngựa', '牛': 'Trâu bò', '羊': 'Dê', '犬': 'Chó',
      '犭': 'Thú', '鸟': 'Chim', '鱼': 'Cá', '虫': 'Sâu bọ', '艹': 'Cỏ cây',
      '竹': 'Tre', '米': 'Gạo', '纟': 'Sợi tơ', '车': 'Xe', '雨': 'Mưa',
      '风': 'Gió', '电': 'Điện', '力': 'Sức lực', '刀': 'Dao', '刂': 'Đao đứng',
      '王': 'Vua/Ngọc', '贝': 'Vỏ sò/Tiền', '见': 'Nhìn thấy', '气': 'Khí/Hơi thở',
      '白': 'Trắng', '大': 'To', '小': 'Nhỏ', '上': 'Trên', '下': 'Dưới', '中': 'Giữa',
      '休': 'Người (亻) tựa vào gốc cây (木) để nghỉ ngơi',
      '好': 'Phụ nữ (女) bên con trẻ (子) là điều tốt đẹp',
      '明': 'Mặt trời (日) và mặt trăng (月) cùng chiếu sáng',
      '看': 'Đưa tay (手) che trên mắt (目) để nhìn',
      '听': 'Dùng miệng (口) và tai lắng nghe',
      '说': 'Dùng lời nói (讠) bày tỏ niềm vui (兑)',
      '吃': 'Miệng (口) ăn đồ ăn (乞)',
      '喝': 'Miệng (口) khát nước (曷) nên uống',
      '想': 'Tâm trí (心) hướng về hình ảnh (相) để suy nghĩ',
      '家': 'Dưới mái nhà (宀) có nuôi lợn (豕) là gia đình',
      '安': 'Phụ nữ (女) ở dưới mái nhà (宀) là bình yên',
      '学': 'Đứa trẻ (子) học tập dưới mái trường (冖)',
      '忙': 'Trong lòng (忄) thấy mất đi (亡) thời gian nên bận rộn',
      '累': 'Làm việc ngoài ruộng (田) mệt đến rã rời sợi tơ (纟)',
      '饿': 'Đồ ăn (饣) của tôi (我) chưa có nên đói',
      '渴': 'Nước (氵) bị mặt trời làm cạn (曷) nên khát'
    };

    const CHAR_COMPONENTS = {
      '休': ['亻', '木'], '息': ['自', '心'], '好': ['女', '子'], '明': ['日', '月'],
      '看': ['手', '目'], '听': ['口', '斤'], '说': ['讠', '兑'], '话': ['讠', '舌'],
      '吃': ['口', '乞'], '喝': ['口', '曷'], '想': ['相', '心'], '忘': ['亡', '心'],
      '忙': ['忄', '亡'], '快': ['忄', '夬'], '慢': ['忄', '曼'], '懂': ['忄', '董'],
      '家': ['宀', '豕'], '安': ['宀', '女'], '字': ['宀', '子'], '室': ['宀', '至'],
      '学': ['小', '冖', '子'], '卖': ['十', '买'], '钱': ['钅', '戋'], '银': ['钅', '艮'],
      '谢': ['讠', '射'], '请': ['讠', '青'], '认': ['讠', '人'], '识': ['讠', '只'],
      '语': ['讠', '吾'], '课': ['讠', '果'], '谁': ['讠', '隹'], '饿': ['饣', '我'],
      '饭': ['饣', '反'], '饮': ['饣', '欠'], '馆': ['饣', '官'], '渴': ['氵', '曷'],
      '洗': ['氵', '先'], '海': ['氵', '每'], '河': ['氵', '可'], '没': ['氵', '殳'],
      '活': ['氵', '舌'], '汽': ['氵', '气'], '油': ['氵', '由'], '打': ['扌', '丁'],
      '找': ['扌', '戈'], '拿': ['合', '手'], '推': ['扌', '隹'], '拉': ['扌', '立'],
      '接': ['扌', '妾'], '换': ['扌', '奂'], '做': ['亻', '故'], '作': ['亻', '乍'],
      '住': ['亻', '主'], '位': ['亻', '立'], '他': ['亻', '也'], '你': ['亻', '尔'],
      '们': ['亻', '门'], '信': ['亻', '言'], '便': ['亻', '更'], '借': ['亻', '昔'],
      '妈': ['女', '马'], '姐': ['女', '且'], '妹': ['女', '未'], '奶': ['女', '乃'],
      '她': ['女', '也'], '姓': ['女', '生'], '婚': ['女', '昏'], '始': ['女', '台'],
      '时': ['日', '寸'], '早': ['日', '十'], '晚': ['日', '免'], '晴': ['日', '青'],
      '星': ['日', '生'], '昨': ['日', '乍'], '朋': ['月', '月'], '期': ['其', '月'],
      '服': ['月', '卩', '又'], '胖': ['月', '半'], '桌': ['卜', '日', '木'], '椅': ['木', '奇'],
      '杯': ['木', '不'], '机': ['木', '几'], '校': ['木', '交'], '楼': ['木', '娄'],
      '累': ['田', '糸'], '男': ['田', '力'], '思': ['田', '心'], '路': ['足', '各'],
      '跑': ['足', '包'], '跟': ['足', '艮'], '远': ['元', '辶'], '近': ['斤', '辶'],
      '进': ['井', '辶'], '送': ['关', '辶'], '还': ['不', '辶'], '这': ['文', '辶'],
      '道': ['首', '辶'], '问': ['门', '口'], '间': ['门', '日'], '闻': ['门', '耳']
    };

    // 6 Chủ đề gốc trong Kho từ
    const CORE_DATABASE = [
      // 1. Chào hỏi & Đại từ
      { hanzi: '你好', pinyin: 'nǐ hǎo', meaning: 'Xin chào', category: 'Chào hỏi & Đại từ', mnemonic: 'Bạn (你) tốt lành (好) → Lời chào thân thiện.' },
      { hanzi: '谢谢', pinyin: 'xiè xie', meaning: 'Cảm ơn', category: 'Chào hỏi & Đại từ', mnemonic: 'Dùng lời nói (讠) bày tỏ sự trân trọng (射).' },
      { hanzi: '不客气', pinyin: 'bú kè qi', meaning: 'Đừng khách sáo', category: 'Chào hỏi & Đại từ', mnemonic: 'Không (不) cần khách (客) khí (气).' },
      { hanzi: '对不起', pinyin: 'duì bu qǐ', meaning: 'Xin lỗi', category: 'Chào hỏi & Đại từ', mnemonic: 'Không dám đối mặt ngẩng đầu lên vì có lỗi.' },
      { hanzi: '没关系', pinyin: 'méi guān xi', meaning: 'Không sao đâu', category: 'Chào hỏi & Đại từ', mnemonic: 'Không (没) có vướng mắc liên quan (关系) gì.' },
      { hanzi: '再见', pinyin: 'zài jiàn', meaning: 'Tạm biệt', category: 'Chào hỏi & Đại từ', mnemonic: 'Lại (再) gặp mặt (见) nhau nhé.' },
      { hanzi: '我们', pinyin: 'wǒ men', meaning: 'Chúng tôi / Chúng ta', category: 'Chào hỏi & Đại từ', mnemonic: 'Tôi (我) cùng nhiều người (亻+门 = 们).' },

    function speakChinese(text) {
      if (!text) return;
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'zh-CN';
          u.rate = state.speechRate;
          const voices = window.speechSynthesis.getVoices();
          const zh = voices.find(v => v.lang.includes('zh') || v.lang.includes('cmn'));
          if (zh) {
            u.voice = zh;
            window.speechSynthesis.speak(u);
            return;
          }
        }
      } catch (e) {}
      const audio = new Audio(`https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-CN&q=${encodeURIComponent(text)}`);
      audio.playbackRate = state.speechRate;
      audio.play().catch(() => {});
    }

    function cycleSpeechRate() {
      const rates = [1.0, 0.8, 1.2];
      state.speechRate = rates[(rates.indexOf(state.speechRate) + 1) % rates.length];

    }

    let typingTimer = null;

    function generateLocalMnemonic(hanzi) {
      const clean = hanzi.replace(/[^\u4e00-\u9fa5]/g, '');
      if (!clean) return '';

      const coreMatch = CORE_DATABASE.find(w => w.hanzi === clean);
      if (coreMatch && coreMatch.mnemonic) return coreMatch.mnemonic;

      if (clean.length === 1 && RADICALS[clean]) {
        return RADICALS[clean];
      }

      const lines = [];
      for (const ch of clean) {
        if (CHAR_COMPONENTS[ch]) {
          const radDesc = CHAR_COMPONENTS[ch].map(r => `${r} (${RADICALS[r] || 'bộ thủ'})`).join(' + ');
          const extra = RADICALS[ch] ? ` → ${RADICALS[ch]}` : '';
          lines.push(`${ch} = ${radDesc}${extra}`);
        } else if (RADICALS[ch]) {
          lines.push(`${ch}: ${RADICALS[ch]}`);
        }
      }
      return lines.join('\n');
    }

    async function fetchVietnameseMeaning(hanzi) {
      const clean = hanzi.trim();
      const found = CORE_DATABASE.find(w => w.hanzi === clean);
      if (found) return found.meaning;

      try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=vi&dt=t&q=${encodeURIComponent(clean)}`);
        if (res.ok) {
          const data = await res.json();
          const vi = data?.[0]?.map(x => x[0]).join('').trim();
          if (vi && vi !== clean) {
            return vi.charAt(0).toUpperCase() + vi.slice(1);
          }
        }
      } catch (e) {}
      return '';
    }

    function onHanziChanged(val) {
      const trimmed = val.trim();
      const pinyinInput = document.getElementById('inputPinyin');
      const meaningInput = document.getElementById('inputMeaning');
      const mnemonicInput = document.getElementById('inputMnemonic');
      const statusEl = document.getElementById('autoStatus');

      if (!trimmed) {
        pinyinInput.value = '';
        statusEl.classList.add('hidden');
        return;
      }

      // 1. Tự điền Pinyin
      if (window.pinyinPro) {
        pinyinInput.value = window.pinyinPro.pinyin(trimmed, { toneType: 'symbol' });
      }

      // 2. Tự điền Chiết tự bộ thủ
      const mnemonic = generateLocalMnemonic(trimmed);
      if (mnemonic) {
        mnemonicInput.value = mnemonic;
      }

      // 3. Tự điền Nghĩa tiếng Việt sau 400ms ngừng gõ
      clearTimeout(typingTimer);
      statusEl.classList.remove('hidden');
      typingTimer = setTimeout(async () => {
        const vi = await fetchVietnameseMeaning(trimmed);
        if (vi && document.getElementById('inputHanzi').value.trim() === trimmed) {
          meaningInput.value = vi;
        }
        statusEl.classList.add('hidden');
      }, 400);
    }

    async function runAiAutoFill() {
      const hanzi = document.getElementById('inputHanzi').value.trim();
      if (!hanzi) {
        alert('Bạn hãy nhập chữ Hán trước rồi bấm nút AI nhé!');
        return;
      }
      if (!state.aiKey) {
        const go = confirm('Bạn chưa nhập API Key (Gemini hoặc DeepSeek). Bạn có muốn sang cuối tab Nhật ký để dán Key vào dùng không?');
        if (go) {
          closeAddModal();
          switchTab('journal');
        }
        return;
      }

      const btn = document.getElementById('aiBtn');
      const oldText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span>⏳...</span>';

      const prompt = `Với từ tiếng Trung "${hanzi}", hãy trả về DUY NHẤT JSON hợp lệ (không markdown): {"meaning": "nghĩa tiếng Việt ngắn gọn nhất", "mnemonic": "giải thích chiết tự bộ thủ thành câu chuyện 1 câu dễ nhớ mặt chữ, ví dụ: Người (人) tựa vào gốc cây (木) để nghỉ ngơi (休)"}`;

      try {
        let text = '';
        if (state.aiProvider === 'deepseek') {
          const r = await fetch('https://api.deepseek.com/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.aiKey}` },
            body: JSON.stringify({ model: 'deepseek-chat', messages: [{ role: 'user', content: prompt }], temperature: 0.4 })
          });
          const d = await r.json();
          if (!r.ok) throw new Error(d.error?.message || 'Lỗi DeepSeek');
          text = d.choices?.[0]?.message?.content || '';
        } else {
          const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${state.aiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.4 } })
          });
          const d = await r.json();
          if (!r.ok) throw new Error(d.error?.message || 'Lỗi Gemini');
          text = d.candidates?.[0]?.content?.parts?.[0]?.text || '';
        }

        const match = text.match(/\{[\s\S]*\}/);
        if (match) {
          const parsed = JSON.parse(match[0]);
          if (parsed.meaning) document.getElementById('inputMeaning').value = parsed.meaning;
          if (parsed.mnemonic) document.getElementById('inputMnemonic').value = parsed.mnemonic;
        }
      } catch (err) {
        alert('Lỗi AI: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = oldText;
      }
    }

        new: { text: '🔴 Mới học', cls: 'bg-[#361c1a] text-[#f87171]' },
        learning: { text: '🟡 Đang nhớ', cls: 'bg-[#362c18] text-[#fbbf24]' },
        mastered: { text: '🟢 Đã thuộc', cls: 'bg-[#193324] text-[#4ade80]' }
      };

      el.innerHTML = `
        <div class="bg-gradient-to-r from-[#471c17] to-[#291614] border border-[#5e2923] rounded-2xl p-3.5 flex items-center justify-between">
          <div>
            <div class="text-xs font-bold text-[#f2ede6] flex items-center gap-1.5">
              <span>🧠</span> Ôn tập Ghi nhớ Nhắc lại
            </div>
            <p class="text-[11px] text-[#cbbeb5] mt-0.5">
              ${selectMode ? `Đã chọn ${selectedReviewIds.size} từ để ôn` : `Còn ${needReview} từ chưa thuộc cần ôn nhắc lại`}
            </p>
          </div>
          <button onclick="startReview()" class="px-3.5 py-2 rounded-xl bg-[#b83d2e] text-white text-xs font-bold active:scale-95 transition whitespace-nowrap">
            Ôn ngay →
          </button>
        </div>

        <div class="flex gap-2">
          <input type="text" value="${vocabSearch}" oninput="vocabSearch=this.value; render()" placeholder="🔍 Tìm trong sổ của bạn..."
            class="flex-1 bg-[#1e1b18] border border-[#2e2924] rounded-xl px-3.5 py-2.5 text-xs text-[#f2ede6] placeholder-[#8c8278] outline-none" />
          <button onclick="openAddModal()" class="px-3.5 py-2.5 rounded-xl bg-[#b83d2e] text-white text-xs font-bold active:scale-95 transition whitespace-nowrap">
            + Tự thêm
          </button>
        </div>

        <div class="flex items-center justify-between gap-1.5 overflow-x-auto pb-1">
          <div class="flex gap-1.5">
            <button onclick="vocabFilter='all'; render()" class="px-2.5 py-1.5 rounded-lg text-[11px] font-medium ${vocabFilter==='all' ? 'bg-[#36302b] text-white' : 'bg-[#1e1b18] text-[#9c9288]'}">Tất cả</button>
            <button onclick="vocabFilter='new'; render()" class="px-2.5 py-1.5 rounded-lg text-[11px] font-medium ${vocabFilter==='new' ? 'bg-[#36302b] text-white' : 'bg-[#1e1b18] text-[#9c9288]'}">🔴 Mới học</button>
            <button onclick="vocabFilter='learning'; render()" class="px-2.5 py-1.5 rounded-lg text-[11px] font-medium ${vocabFilter==='learning' ? 'bg-[#36302b] text-white' : 'bg-[#1e1b18] text-[#9c9288]'}">🟡 Đang nhớ</button>
          </div>
          <button onclick="toggleSelectMode()" class="px-2.5 py-1.5 rounded-lg text-[11px] font-medium border ${selectMode ? 'bg-[#3a251d] border-[#e07a5f] text-[#e07a5f]' : 'bg-[#1e1b18] border-[#2e2924] text-[#9c9288]'}">
            ☑️ Chọn ôn
          </button>
        </div>

        <div class="space-y-2.5">
          ${list.length === 0 ? `<div class="text-center py-10 text-xs text-[#8c8278]">Chưa có từ nào. Bấm "+ Tự thêm" hoặc chọn từ ở tab "Kho từ" nhé!</div>` : ''}
          ${list.map(w => `
            <div onclick="${selectMode ? `toggleSelectWord(${w.id})` : ''}" class="bg-[#1e1b18] border ${selectMode && selectedReviewIds.has(w.id) ? 'border-[#e07a5f]' : 'border-[#2e2924]'} rounded-2xl p-3.5 space-y-2">
              <div class="flex items-start justify-between">
                <div class="flex items-center gap-3">
                  ${selectMode ? `<input type="checkbox" ${selectedReviewIds.has(w.id) ? 'checked' : ''} class="w-4 h-4 accent-[#b83d2e]" />` : ''}
                  <div>
                    <div class="flex items-baseline gap-2">
                      <span onclick="event.stopPropagation(); speakChinese('${w.hanzi}')" class="text-2xl font-bold hanzi-font text-[#f2ede6] cursor-pointer active:text-[#e07a5f]">${w.hanzi}</span>
                      <span class="text-xs font-medium text-[#e07a5f]">${w.pinyin}</span>
                    </div>
                    <div class="text-sm font-semibold text-[#e6dfd5] mt-0.5">${w.meaning}</div>
                  </div>
                </div>
                <div class="flex items-center gap-1.5">
                  <button onclick="event.stopPropagation(); speakChinese('${w.hanzi}')" class="w-8 h-8 rounded-lg bg-[#28231f] text-xs flex items-center justify-center active:scale-90">🔊</button>
                  <button onclick="event.stopPropagation(); openWriterModal('${w.hanzi}', '${w.pinyin} - ${w.meaning}')" class="w-8 h-8 rounded-lg bg-[#28231f] text-xs flex items-center justify-center active:scale-90">✍️</button>
                  <button onclick="event.stopPropagation(); deleteWord(${w.id})" class="w-8 h-8 rounded-lg bg-[#28231f] text-xs text-[#8c8278] flex items-center justify-center active:scale-90">🗑️</button>
                </div>
              </div>
              ${w.mnemonic ? `<div class="text-[11px] text-[#d9b86c] bg-[#292418] border border-[#3d3520] px-3 py-2 rounded-xl whitespace-pre-line leading-relaxed">💡 ${w.mnemonic}</div>` : ''}
              <div class="flex items-center justify-between pt-0.5">
                <span class="text-[10px] px-2 py-0.5 rounded-md font-medium ${badges[w.level].cls}">${badges[w.level].text}</span>
                <button onclick="event.stopPropagation(); cycleWordLevel(${w.id})" class="text-[11px] text-[#9c9288] underline">Đổi mức độ</button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderDatabase(el) {
      const cats = ['Tất cả', ...new Set(CORE_DATABASE.map(i => i.category))];
      const existing = new Set(state.vocab.map(w => w.hanzi));
      const items = CORE_DATABASE.filter(i => {
        const okCat = dbCategory === 'Tất cả' || i.category === dbCategory;
        const q = dbSearch.toLowerCase();
        const okQ = !q || i.hanzi.includes(q) || i.pinyin.toLowerCase().includes(q) || i.meaning.toLowerCase().includes(q);
        return okCat && okQ;
      });

      el.innerHTML = `
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-sm font-bold text-[#f2ede6]">Kho từ giao tiếp cốt lõi</h2>
            <p class="text-[11px] text-[#9c9288]">Tích chọn các từ đang học để thêm vào Sổ học</p>
          </div>
          ${dbSelected.size > 0 ? `
            <button onclick="importSelectedDb()" class="px-3 py-2 rounded-xl bg-[#b83d2e] text-white text-xs font-bold active:scale-95">
              + Thêm ${dbSelected.size} từ
            </button>
          ` : ''}
        </div>

        <input type="text" value="${dbSearch}" oninput="dbSearch=this.value; render()" placeholder="🔍 Tìm chữ Hán, Pinyin hoặc nghĩa Việt..."
          class="w-full bg-[#1e1b18] border border-[#2e2924] rounded-xl px-3.5 py-2.5 text-xs text-[#f2ede6] placeholder-[#8c8278] outline-none" />

        <div class="flex gap-1.5 overflow-x-auto pb-1">
          ${cats.map(c => `
            <button onclick="dbCategory='${c}'; render()" class="px-2.5 py-1.5 rounded-lg text-[11px] font-medium whitespace-nowrap ${dbCategory===c ? 'bg-[#b83d2e] text-white' : 'bg-[#1e1b18] text-[#9c9288]'}">${c}</button>
          `).join('')}
        </div>

        <div class="space-y-2">
          ${items.map(i => {
            const added = existing.has(i.hanzi);
            const checked = dbSelected.has(i.hanzi);
            return `
              <div onclick="${added ? '' : `toggleDb('${i.hanzi}')`}" class="bg-[#1e1b18] border ${checked ? 'border-[#e07a5f]' : 'border-[#2e2924]'} rounded-2xl p-3 flex items-center justify-between ${added ? 'opacity-55' : 'cursor-pointer'}">
                <div class="flex items-center gap-3">
                  <input type="checkbox" ${added || checked ? 'checked' : ''} ${added ? 'disabled' : ''} class="w-4 h-4 accent-[#b83d2e]" />
                  <div>
                    <div class="flex items-baseline gap-2">
                      <span onclick="event.stopPropagation(); speakChinese('${i.hanzi}')" class="text-xl font-bold hanzi-font text-[#f2ede6]">${i.hanzi}</span>
                      <span class="text-xs text-[#e07a5f]">${i.pinyin}</span>
                    </div>
                    <div class="text-xs font-semibold text-[#e6dfd5]">${i.meaning}</div>
                    <div class="text-[11px] text-[#d9b86c] mt-0.5">💡 ${i.mnemonic}</div>
                  </div>
                </div>
                <button onclick="event.stopPropagation(); speakChinese('${i.hanzi}')" class="w-8 h-8 rounded-lg bg-[#28231f] text-xs flex items-center justify-center shrink-0">🔊</button>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderSpeak(el) {
      el.innerHTML = `
        <div class="bg-[#1e1b18] border border-[#2e2924] rounded-2xl p-3.5">
          <h2 class="text-sm font-bold text-[#f2ede6]">Che mờ luyện phản xạ nói</h2>
          <p class="text-[11px] text-[#9c9288] mt-0.5">Nhìn tiếng Việt tập nói trước, sau đó chạm vào khung mờ để kiểm tra</p>
        </div>
        ${SPEAKING_DATA.map(g => `
          <div class="space-y-2">
            <h3 class="text-xs font-bold text-[#e07a5f] px-1">${g.topic}</h3>
            ${g.sentences.map(s => `
              <div class="bg-[#1e1b18] border border-[#2e2924] rounded-2xl p-3.5 space-y-2">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-semibold text-[#e6dfd5]">🇻🇳 ${s.vi}</span>
                  <button onclick="speakChinese('${s.hanzi}')" class="px-2.5 py-1 rounded-lg bg-[#28231f] text-xs text-[#f2ede6]">🔊 Nghe</button>
                </div>
                <div onclick="this.classList.toggle('revealed')" class="blur-item bg-[#26221e] rounded-xl p-2.5 cursor-pointer">
                  <div onclick="event.stopPropagation(); speakChinese('${s.hanzi}')" class="text-lg font-bold hanzi-font text-[#f2ede6]">${s.hanzi}</div>
                  <div class="text-xs text-[#e07a5f] mt-0.5">${s.pinyin}</div>
                </div>
              </div>
            `).join('')}
          </div>
        `).join('')}
      `;
    }

    function renderJournal(el) {
      el.innerHTML = `
        <div class="bg-[#1e1b18] border border-[#2e2924] rounded-2xl p-3.5 space-y-2.5">
          <h2 class="text-sm font-bold text-[#f2ede6]">Nhật ký đặt câu tiếng Trung</h2>
          <input type="text" id="journalHanzi" placeholder="Gõ câu tiếng Trung bạn tự đặt..."
            class="w-full bg-[#2c2621] border border-[#3d352e] rounded-xl px-3 py-2 text-sm hanzi-font text-[#f2ede6] outline-none" />
          <div class="flex gap-2">
            <input type="text" id="journalVi" placeholder="Nghĩa tiếng Việt..."
              class="flex-1 bg-[#2c2621] border border-[#3d352e] rounded-xl px-3 py-2 text-xs text-[#f2ede6] outline-none" />
            <button onclick="addJournalEntry()" class="px-4 py-2 rounded-xl bg-[#b83d2e] text-white text-xs font-bold">Lưu câu</button>
          </div>
        </div>

        <div class="space-y-2">
          ${state.journal.map(j => `
            <div class="bg-[#1e1b18] border border-[#2e2924] rounded-2xl p-3.5 flex items-start justify-between">
              <div>
                <div class="text-[10px] text-[#8c8278]">${j.date}</div>
                <div onclick="speakChinese('${j.hanzi}')" class="text-lg font-bold hanzi-font text-[#f2ede6] mt-0.5 cursor-pointer">${j.hanzi}</div>
                <div class="text-xs text-[#e07a5f]">${j.pinyin}</div>
                <div class="text-xs text-[#dfd7cd] mt-1">${j.vi}</div>
              </div>
              <button onclick="speakChinese('${j.hanzi}')" class="w-8 h-8 rounded-lg bg-[#28231f] text-xs flex items-center justify-center">🔊</button>
            </div>
          `).join('')}
        </div>

        <!-- Cấu hình AI Chiết tự (Tùy chọn) -->
        <div class="bg-[#1e1b18] border border-[#2e2924] rounded-2xl p-3.5 space-y-2.5">
          <div class="text-xs font-bold text-[#d9b86c]">✨ Cài đặt nút AI Chiết tự (Tùy chọn)</div>
          <p class="text-[11px] text-[#9c9288]">Mặc định web đã tự điền nghĩa &amp; tách bộ thủ miễn phí. Nếu muốn nút ✨ AI viết thành câu chuyện, dán API Key vào đây (lưu riêng trên máy bạn):</p>
          <div class="flex gap-2">
            <select id="cfgProvider" onchange="saveAiSettings()" class="bg-[#2c2621] border border-[#3d352e] rounded-xl px-2.5 py-2 text-xs text-[#f2ede6] outline-none">
              <option value="gemini" ${state.aiProvider==='gemini' ? 'selected' : ''}>Gemini</option>
              <option value="deepseek" ${state.aiProvider==='deepseek' ? 'selected' : ''}>DeepSeek</option>
            </select>
            <input type="password" id="cfgKey" value="${state.aiKey}" onchange="saveAiSettings()" placeholder="Dán API Key..."
              class="flex-1 bg-[#2c2621] border border-[#3d352e] rounded-xl px-3 py-2 text-xs text-[#f2ede6] outline-none" />
          </div>
        </div>

        <!-- Sao lưu dữ liệu -->
        <div class="bg-[#1e1b18] border border-[#2e2924] rounded-2xl p-3.5 space-y-2.5">
          <div class="text-xs font-bold text-[#f2ede6]">Sao lưu &amp; Khôi phục dữ liệu</div>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="exportJson()" class="py-2.5 rounded-xl bg-[#28231f] text-xs font-semibold text-[#f2ede6]">⬇️ Xuất file sao lưu</button>
            <label class="py-2.5 rounded-xl bg-[#28231f] text-xs font-semibold text-[#f2ede6] text-center cursor-pointer">
              ⬆️ Khôi phục file
              <input type="file" accept=".json" onchange="importJson(event)" class="hidden" />
            </label>
          </div>
        </div>
      `;
    }

    function saveAiSettings() {
      state.aiProvider = document.getElementById('cfgProvider').value;
      state.aiKey = document.getElementById('cfgKey').value.trim();
      saveData();
    }

    function addJournalEntry() {
      const hanzi = document.getElementById('journalHanzi').value.trim();
      const vi = document.getElementById('journalVi').value.trim();
      if (!hanzi) return;
      const pinyin = window.pinyinPro ? window.pinyinPro.pinyin(hanzi, { toneType: 'symbol' }) : '';
      state.journal.unshift({ id: Date.now(), date: new Date().toISOString().slice(0, 10), hanzi, pinyin, vi });
      saveData();
      render();
    }

    // ==========================================
    // 6. MODAL THÊM TỪ, FLASHCARD & VIẾT NÉT
    // ==========================================
    function openAddModal() {
      document.getElementById('inputHanzi').value = '';
      document.getElementById('inputPinyin').value = '';
      document.getElementById('inputMeaning').value = '';
      document.getElementById('inputMnemonic').value = '';
      document.getElementById('inputLevel').value = 'new';
      document.getElementById('autoStatus').classList.add('hidden');
      const m = document.getElementById('addModal');
      m.classList.remove('hidden');
      m.classList.add('flex');
      setTimeout(() => document.getElementById('inputHanzi').focus(), 100);
    }

    function closeAddModal() {
      const m = document.getElementById('addModal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    function saveNewWord() {
      const hanzi = document.getElementById('inputHanzi').value.trim();
      const pinyin = document.getElementById('inputPinyin').value.trim();
      const meaning = document.getElementById('inputMeaning').value.trim();
      const mnemonic = document.getElementById('inputMnemonic').value.trim();
      const level = document.getElementById('inputLevel').value;
      if (!hanzi || !meaning) {
        alert('Vui lòng nhập Chữ Hán và Nghĩa tiếng Việt!');
        return;
      }
      state.vocab.unshift({ id: Date.now(), hanzi, pinyin, meaning, mnemonic, level });
      saveData();
      closeAddModal();
      render();
    }

    function deleteWord(id) {
      if (!confirm('Xóa từ này khỏi sổ?')) return;
      state.vocab = state.vocab.filter(w => w.id !== id);
      selectedReviewIds.delete(id);
      saveData();
      render();
    }

    function cycleWordLevel(id) {
      const seq = ['new', 'learning', 'mastered'];
      const w = state.vocab.find(x => x.id === id);
      if (w) {
        w.level = seq[(seq.indexOf(w.level) + 1) % seq.length];
        saveData();
        render();
      }
    }

    function toggleSelectMode() {
      selectMode = !selectMode;
      selectedReviewIds.clear();
      render();
    }

    function toggleSelectWord(id) {
      if (selectedReviewIds.has(id)) selectedReviewIds.delete(id);
      else selectedReviewIds.add(id);
      render();
    }

    function toggleDb(hanzi) {
      if (dbSelected.has(hanzi)) dbSelected.delete(hanzi);
      else dbSelected.add(hanzi);
      render();
    }

    function importSelectedDb() {
      const picked = CORE_DATABASE.filter(i => dbSelected.has(i.hanzi));
      picked.forEach((i, idx) => {
        state.vocab.unshift({ id: Date.now() + idx, hanzi: i.hanzi, pinyin: i.pinyin, meaning: i.meaning, mnemonic: i.mnemonic, level: 'new' });
      });
      dbSelected.clear();
      saveData();
      switchTab('vocab');
    }

    function startReview() {
      let pool = (selectMode && selectedReviewIds.size > 0)
        ? state.vocab.filter(w => selectedReviewIds.has(w.id))
        : state.vocab.filter(w => w.level !== 'mastered');
      if (pool.length === 0) pool = [...state.vocab];
      if (pool.length === 0) {
        alert('Sổ chưa có từ nào để ôn!');
        return;
      }
      reviewQueue = [...pool];
      reviewIdx = 0;
      const m = document.getElementById('reviewModal');
      m.classList.remove('hidden');
      m.classList.add('flex');
      showReviewCard();
    }

    function closeReviewModal() {
      const m = document.getElementById('reviewModal');
      m.classList.add('hidden');
      m.classList.remove('flex');
      render();
    }

    function showReviewCard() {
      if (reviewIdx >= reviewQueue.length) {
        alert('🎉 Hoàn thành phiên ôn tập!');
        closeReviewModal();
        return;
      }
      const w = reviewQueue[reviewIdx];
      reviewRevealed = false;
      document.getElementById('reviewCounter').textContent = `${reviewIdx + 1} / ${reviewQueue.length}`;
      document.getElementById('reviewHanzi').textContent = w.hanzi;
      document.getElementById('reviewPinyin').textContent = w.pinyin;
      document.getElementById('reviewMeaning').textContent = w.meaning;
      document.getElementById('reviewMnemonic').textContent = w.mnemonic ? `💡 ${w.mnemonic}` : 'Chưa có ghi chú chiết tự';
      document.getElementById('reviewAnswer').classList.add('hidden');
      speakChinese(w.hanzi);
    }

    function flipReviewCard() {
      reviewRevealed = !reviewRevealed;
      document.getElementById('reviewAnswer').classList.toggle('hidden', !reviewRevealed);
    }

    function speakCurrentReview() {
      const w = reviewQueue[reviewIdx];
      if (w) speakChinese(w.hanzi);
    }

    function gradeReview(res) {
      const w = reviewQueue[reviewIdx];
      const orig = state.vocab.find(x => x.id === w.id);
      if (res === 'again') {
        if (orig) orig.level = 'new';
        reviewQueue.splice(Math.min(reviewQueue.length, reviewIdx + 3), 0, w);
      } else if (res === 'good') {
        if (orig) orig.level = 'learning';
      } else if (res === 'easy') {
        if (orig) orig.level = 'mastered';
      }
      saveData();
      reviewIdx++;
      showReviewCard();
    }

    function openWriterModal(hanzi, info) {
      const chars = hanzi.replace(/[^\u4e00-\u9fa5]/g, '').split('');
      if (!chars.length) return;
      document.getElementById('writerInfo').textContent = info;
      document.getElementById('writerChars').innerHTML = chars.map(c =>
        `<button onclick="loadWriterChar('${c}')" class="w-10 h-10 rounded-xl bg-[#28231f] text-lg hanzi-font font-bold text-[#f2ede6] border border-[#3d352e]">${c}</button>`
      ).join('');
      const m = document.getElementById('writerModal');
      m.classList.remove('hidden');
      m.classList.add('flex');
      loadWriterChar(chars[0]);
    }

    function loadWriterChar(c) {
      const box = document.getElementById('writerCanvas');
      box.innerHTML = '';
      writerInstance = HanziWriter.create('writerCanvas', c, {
        width: 220, height: 220, padding: 15,
        strokeColor: '#f2ede6', radicalColor: '#e07a5f', outlineColor: '#3d352e', showOutline: true
      });
      writerInstance.animateCharacter();
    }

    function animateWriter() { if (writerInstance) writerInstance.animateCharacter(); }
    function quizWriter() { if (writerInstance) writerInstance.quiz(); }
    function closeWriterModal() {
      const m = document.getElementById('writerModal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    function exportJson() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `sotay-hanngu-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
    }

    function importJson(ev) {
      const f = ev.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = e => {
        try {
          const data = JSON.parse(e.target.result);
          if (Array.isArray(data.vocab)) {
            state = { ...state, ...data };
            saveData();
            render();
            alert('✅ Khôi phục thành công!');
          }
        } catch (err) { alert('File không hợp lệ!'); }
      };
      r.readAsText(f);
    }

    loadData();
    render();
  </script>
</body>
</html>
